<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>디시인사이드 삭제 동작 분석기</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>삭제 동작 분석기</h1>
      <p class="sub">수동 삭제 관찰 · 자동 삭제 없음</p>
    </header>

    <section class="status-box" aria-live="polite">
      <div class="label">상태</div>
      <div id="statusText" class="status stopped">기록 중지됨</div>
    </section>

    <section class="count-box">
      <span>기록된 이벤트: <strong id="eventCount">0</strong>개</span>
    </section>

    <section class="actions">
      <button type="button" id="btnStart" class="btn primary">기록 시작</button>
      <button type="button" id="btnStop" class="btn">기록 중지</button>
      <button type="button" id="btnClear" class="btn danger">로그 초기화</button>
      <button type="button" id="btnDownload" class="btn accent">JSON 로그 다운로드</button>
    </section>

    <p id="errorText" class="error" hidden></p>

    <p class="hint">
      기록 시작 후 디시인사이드 마이페이지에서 게시글 1개를 직접 삭제하세요.
      삭제 완료 후 기록을 중지하고 JSON 파일을 다운로드하세요.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
