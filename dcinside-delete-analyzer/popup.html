<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DCInside 게시글 삭제 도구</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>DCInside 게시글 삭제 도구</h1>
      <p class="sub">본인 갤로그 게시글만 · 순차 삭제</p>
    </header>

    <section class="card">
      <div class="label">현재 게시글</div>
      <div id="totalCount" class="big">—</div>
      <div id="pageMeta" class="muted">페이지 확인 중…</div>
    </section>

    <section class="card">
      <div class="label">상태</div>
      <div id="statusText" class="status">준비됨</div>
      <div id="statusMessage" class="muted"></div>
    </section>

    <section class="card">
      <div class="label">진행률</div>
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="progressText" class="muted">0 / 0</div>
      <div class="stats">
        <span>성공 <strong id="successCount">0</strong></span>
        <span>실패 <strong id="failCount">0</strong></span>
      </div>
      <div id="currentNo" class="muted">현재 처리 중: —</div>
    </section>

    <section class="card">
      <div class="label">클릭 전 대기 (페이지 로드 후)</div>
      <div class="delay-row">
        <label><input type="radio" name="delay" value="safe" checked /> 안전 (1.5초)</label>
        <label><input type="radio" name="delay" value="normal" /> 보통 (1초)</label>
      </div>
    </section>

    <section class="actions" id="actionsIdle">
      <button type="button" id="btnTest5" class="btn primary">테스트 5개 삭제</button>
      <button type="button" id="btnSelected" class="btn">선택 글 삭제</button>
      <button type="button" id="btnAll" class="btn danger">전체 삭제 시작</button>
      <button type="button" id="btnRefresh" class="btn ghost">페이지 정보 새로고침</button>
    </section>

    <section class="actions hidden" id="actionsRunning">
      <button type="button" id="btnPause" class="btn warn">일시정지</button>
      <button type="button" id="btnResume" class="btn primary hidden">재개</button>
      <button type="button" id="btnStop" class="btn danger">중지</button>
    </section>

    <p id="errorText" class="error hidden"></p>
    <p class="hint">
      먼저 <strong>테스트 5개 삭제</strong>로 동작을 확인하세요.
      전체 삭제는 2단계 확인 후 실행됩니다.
    </p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
