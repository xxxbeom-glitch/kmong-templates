<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Icons Library — _icons</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e6e4df;
    --accent: #1f4b3a;
    --accent-soft: #e8f0ec;
    --chip: #efece6;
    --danger: #9b2c2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(246,245,242,.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 1rem 1.25rem 0.85rem;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1rem;
    align-items: center;
    justify-content: space-between;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    max-width: 1400px;
    margin: 0.85rem auto 0;
  }
  input[type="search"] {
    flex: 1 1 220px;
    min-width: 180px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 0.65rem 0.85rem;
    font: inherit;
  }
  input[type="search"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    border-radius: 999px;
    padding: 0.4rem 0.75rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .chip.is-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.25rem;
  }
  section { margin-bottom: 2rem; }
  section.hidden { display: none; }
  .sec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.75rem;
  }
  .sec-head h2 {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 0.65rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.75rem 0.5rem 0.55rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .card.hidden { display: none; }
  .preview {
    height: 48px;
    display: grid;
    place-items: center;
    margin-bottom: 0.45rem;
  }
  .preview img {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }
  .preview .lottie {
    width: 44px;
    height: 44px;
  }
  .name {
    font-size: 0.68rem;
    color: var(--muted);
    word-break: break-all;
    line-height: 1.25;
  }
  .badge {
    display: inline-block;
    margin-top: 0.3rem;
    font-size: 0.62rem;
    padding: 0.12rem 0.35rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge.fill { background: #f3ebe2; color: #7a4e2d; }
  .badge.motion { background: #e8eaf6; color: #3949ab; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.25rem;
    transform: translateX(-50%) translateY(120%);
    background: var(--ink);
    color: #fff;
    padding: 0.65rem 1rem;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    transition: .2s ease;
    z-index: 50;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .note {
    color: var(--muted);
    font-size: 0.82rem;
    margin: 0 0 1rem;
  }
  .empty {
    display: none;
    color: var(--muted);
    padding: 2rem;
    text-align: center;
  }
  .empty.show { display: block; }
</style>
</head>

      <div>
        <h1>Icons Library</h1>
        <div class="meta">로컬 전용 · 클릭 시 경로 복사 · 총 385개 (ui 360 · social 20 · motion 5)</div>

  </header>

    <section data-section="social" id="sec-social">
      <div class="sec-head"><h2>Social</h2><span class="meta">20</span></div>
      <div class="grid" id="grid-social"></div>
    </section>

    <section data-section="motion" id="sec-motion">
      <div class="sec-head"><h2>Motion (Lottie)</h2><span class="meta">5</span></div>
      <div class="grid" id="grid-motion"></div>
    </section>

    <section data-section="ui" id="sec-ui">
      <div class="sec-head"><h2>UI</h2><span class="meta">360</span></div>
      <div class="grid" id="grid-ui"></div>
    </section>
  </main>

  <div class="toast" id="toast">복사됨</div>

      el.dataset.path = item.path;
      el.dataset.group = item.group || '';
      el.title = item.path + ' (클릭: 경로 복사)';
      el.innerHTML = `
        <div class="preview"><img src="${item.path}" alt="" loading="lazy" /></div>
        <div class="name">${item.base}</div>
        <span class="badge ${item.type}">${item.type}</span>
      `;
      el.addEventListener('click', () => copyText(item.path));
      return el;
    }

    function makeMotionCard(item) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'card';
      el.dataset.cat = 'motion';
      el.dataset.type = 'motion';
      el.dataset.name = item.base;
      el.dataset.path = item.path;
      el.title = item.path + ' (클릭: 경로 복사)';
      const box = document.createElement('div');
      box.className = 'preview';
      const host = document.createElement('div');
      host.className = 'lottie';
      box.appendChild(host);
      el.appendChild(box);
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.base;
      el.appendChild(name);
      const badge = document.createElement('span');
      badge.className = 'badge motion';
      badge.textContent = 'motion';
      el.appendChild(badge);
      el.addEventListener('click', () => copyText(item.path));

      const animData = DATA.lottie[item.file];
      if (window.lottie && animData) {
        try {
          window.lottie.loadAnimation({
            container: host,
            renderer: 'svg',
            loop: true,
            autoplay: true,
            animationData: animData,
          });
        } catch (e) {
          host.textContent = '▶';
        }
      } else {
        host.textContent = '▶';
      }
      return el;
    }

    function render() {
      const gSocial = document.getElementById('grid-social');
      const gMotion = document.getElementById('grid-motion');
      const gUi = document.getElementById('grid-ui');
      gSocial.innerHTML = '';
      gMotion.innerHTML = '';
      gUi.innerHTML = '';

      DATA.social.forEach((i) => gSocial.appendChild(makeSvgCard(i, 'social')));
      DATA.motion.forEach((i) => gMotion.appendChild(makeMotionCard(i)));
      DATA.ui.forEach((i) => gUi.appendChild(makeSvgCard(i, 'ui')));
      applyFilter();
    }

    function matchCard(card) {
      const name = card.dataset.name || '';
      const type = card.dataset.type || '';
      const c = card.dataset.cat || '';
      const path = card.dataset.path || '';
      if (q) {
        const qq = q.toLowerCase();
        if (!name.includes(qq) && !path.toLowerCase().includes(qq) && !type.includes(qq)) return false;
      }
      if (cat === 'all') return true;
      if (cat === 'line' || cat === 'fill') return type === cat;
      return c === cat;
    }

    function applyFilter() {
      let visible = 0;
      document.querySelectorAll('.card').forEach((card) => {
        const ok = matchCard(card);
        card.classList.toggle('hidden', !ok);
        if (ok) visible++;
      });
      document.querySelectorAll('section[data-section]').forEach((sec) => {
        const any = sec.querySelectorAll('.card:not(.hidden)').length > 0;
        const showSec =
          cat === 'all' ||
          cat === 'line' ||
          cat === 'fill' ||
          sec.dataset.section === cat;
        sec.classList.toggle('hidden', !showSec || !any);
      });
      emptyEl.classList.toggle('show', visible === 0);
    }

    document.getElementById('q').addEventListener('input', (e) => {
      q = e.target.value.trim().toLowerCase();
      applyFilter();
    });

    document.getElementById('cat-chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      cat = btn.dataset.cat;
      document.querySelectorAll('#cat-chips .chip').forEach((c) => c.classList.toggle('is-active', c === btn));
      applyFilter();
    });

    render();
  </script>
</body>
</html>
