<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 예약 — 클레어 클리닉</title>
  <link rel="stylesheet" href="../../_tokens/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reservation">
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="site-logo">클레어 클리닉</a>
      <button type="button" class="menu-toggle" aria-label="메뉴 열기">
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
        <span class="menu-toggle__bar"></span>
      </button>
      <nav class="site-nav" aria-label="주요 메뉴">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a href="doctors.html" class="site-nav__link" data-nav="doctors">의료진소개</a></li>
          <li class="site-nav__item"><a href="services.html" class="site-nav__link" data-nav="services">진료과목</a></li>
          <li class="site-nav__item"><a href="notice.html" class="site-nav__link" data-nav="notice">공지사항</a></li>
          <li class="site-nav__item"><a href="reservation.html" class="site-nav__link site-nav__link--cta" data-nav="reservation">온라인예약</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero__title">온라인 예약</h1>
        <p class="page-hero__desc">원하시는 진료과목과 일시를 선택해 주세요 (와이어프레임)</p>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container">
        <form class="form" action="#" method="post">
          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="name">이름</label>
              <input class="form__input" type="text" id="name" name="name" placeholder="홍길동">
            </div>
            <div class="form__group">
              <label class="form__label" for="phone">연락처</label>
              <input class="form__input" type="tel" id="phone" name="phone" placeholder="010-0000-0000">
            </div>
          </div>
          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="department">진료과목</label>
              <select class="form__select" id="department" name="department">
                <option value="">선택해 주세요</option>
                <option>내과 · 검진</option>
                <option>피부 · 미용</option>
                <option>정형 · 재활</option>
                <option>소아 · 예방접종</option>
              </select>
            </div>
            <div class="form__group">
              <label class="form__label" for="doctor">담당 의료진</label>
              <select class="form__select" id="doctor" name="doctor">
                <option value="">선택해 주세요</option>
                <option>김지현 원장</option>
                <option>박서준 전문의</option>
                <option>이수연 전문의</option>
                <option>최민호 전문의</option>
              </select>
            </div>
          </div>
          <div class="form__row">
            <div class="form__group">
              <label class="form__label" for="date">희망 날짜</label>
              <input class="form__input" type="date" id="date" name="date">
            </div>
            <div class="form__group">
              <label class="form__label" for="time">희망 시간</label>
              <select class="form__select" id="time" name="time">
                <option value="">선택해 주세요</option>
                <option>09:00</option>
                <option>10:00</option>
                <option>11:00</option>
                <option>14:00</option>
                <option>15:00</option>
                <option>16:00</option>
                <option>17:00</option>
              </select>
            </div>
          </div>
          <div class="form__group">
            <label class="form__label" for="message">요청사항</label>
            <textarea class="form__textarea" id="message" name="message" placeholder="증상이나 문의 내용을 간단히 적어 주세요"></textarea>
          </div>
          <div class="form__group">
            <label class="form__label">
              <input type="checkbox" name="agree"> 개인정보 수집·이용에 동의합니다 (와이어프레임)
            </label>
          </div>
          <button type="submit" class="btn btn--primary btn--block">예약 신청</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer__name">클레어 클리닉</p>
      <div class="site-footer__info">
        <p>서울특별시 강남구 테헤란로 000 클레어빌딩 3~5층</p>
        <p>대표전화 02-000-0000 · 팩스 02-000-0001</p>
        <p>진료시간 평일 09:00–18:00 / 토요일 09:00–13:00 (일·공휴일 휴진)</p>
      </div>
      <p class="site-footer__copy">© 2026 Claire Clinic. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
</body>
</html>
