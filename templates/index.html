<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templates</title>
  <style>
    body {
      margin: 0;
      padding: 32px 24px;
      font-family: SUIT, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: 700;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li + li {
      margin-top: 8px;
    }

    a {
      color: #0f408f;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .hub-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }

    .hub-links__sep {
      color: #ccc;
      font-weight: 400;
    }

    .hub-note {
      margin: 0 0 20px;
      padding: 12px 14px;
      border-radius: 6px;
      background: #fef3f2;
      color: #b42318;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Templates</h1>
  <p id="hub-note" class="hub-note" hidden>
    file:// 로 열면 admin(PHP)이 동작하지 않습니다.
    Laragon: <a href="http://localhost/kmong/index.html">http://localhost/kmong/index.html</a>
  </p>
  <ul>
    <li class="hub-links">
      <a data-hub-path="mainstream/index.html" href="mainstream/index.html">mainstream</a>
      <span class="hub-links__sep" aria-hidden="true">·</span>
      <a data-hub-path="mainstream/admin/login.php" href="mainstream/admin/login.php">admin</a>
    </li>
    <li class="hub-links">
      <a data-hub-path="guyeon-lawfirm/index.html" href="guyeon-lawfirm/index.html">guyeon-lawfirm</a>
      <span class="hub-links__sep" aria-hidden="true">·</span>
      <a data-hub-path="guyeon-lawfirm/about-intro.html" href="guyeon-lawfirm/about-intro.html">about-intro</a>
    </li>
    <li><a data-hub-path="template-homepage/index.html" href="template-homepage/index.html">template-homepage</a></li>
  </ul>
  <script>
    (function () {
      if (location.protocol !== "file:") {
        return;
      }

      var note = document.getElementById("hub-note");
      if (note) {
        note.hidden = false;
      }

      document.querySelectorAll("[data-hub-path]").forEach(function (link) {
        link.href = "http://localhost/kmong/" + link.getAttribute("data-hub-path");
      });
    })();
  </script>
</body>
</html>
