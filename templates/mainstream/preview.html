<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMO · 검수</title>
  <style>
    :root {
      --bar-h: 44px;
      --bar-bg: #1a1a1a;
      --bar-fg: #f5f5f5;
      --bar-muted: #888;
      --bar-active: #fff;
      --bar-accent: #0f408f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: SUIT, sans-serif;
      background: #e8e8e8;
    }

    .preview-bar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
      height: var(--bar-h);
      padding: 0 12px;
      background: var(--bar-bg);
      color: var(--bar-fg);
      font-size: 13px;
    }

    .preview-bar__label {
      flex-shrink: 0;
      margin-right: 4px;
      font-weight: 700;
      color: var(--bar-muted);
    }

    .preview-bar__tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .preview-bar__tab {
      padding: 6px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--bar-muted);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .preview-bar__tab.is-active {
      background: var(--bar-accent);
      color: var(--bar-active);
    }

    .preview-bar__tab:hover:not(.is-active) {
      color: var(--bar-active);
    }

    .preview-bar__viewport {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .preview-bar__viewport .preview-bar__tab.is-active {
      background: #333;
    }

    .preview-stage {
      padding-top: var(--bar-h);
      min-height: 100dvh;
    }

    .preview-frame-wrap {
      width: 100%;
      min-height: calc(100dvh - var(--bar-h));
      margin-inline: auto;
      background: #fff;
      transition: max-width 0.2s ease;
    }

    .preview-frame-wrap.is-mobile {
      max-width: 390px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: calc(100dvh - var(--bar-h));
      border: 0;
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <span class="preview-bar__label">검수</span>
    <div class="preview-bar__tabs" id="preview-tabs" role="tablist" aria-label="검수 범위"></div>
    <div class="preview-bar__viewport" role="group" aria-label="화면 너비">
      <button type="button" class="preview-bar__tab" data-width="390">390</button>
      <button type="button" class="preview-bar__tab" data-width="full">전체</button>
    </div>
  </div>

  <div class="preview-stage">
    <div class="preview-frame-wrap is-mobile" id="preview-wrap">
      <iframe
        id="preview-frame"
        class="preview-frame"
        title="mainstream 미리보기"
        src="index.html"
      ></iframe>
    </div>
  </div>

  <script>
    /* 작업 진행 시 여기 modes만 추가·수정 — 북마크 URL은 preview.html 고정 */
    var PREVIEW_MODES = [
      { id: "gnb", label: "GNB" },
      { id: "hero-story", label: "Hero+Story" },
      { id: "stats-news", label: "Stats+News" },
      { id: "", label: "전체" },
    ];

    var DEFAULT_MODE = "";
    var DEFAULT_WIDTH = "390";
    var STORAGE_KEY = "mainstream-preview";

    var tabsEl = document.getElementById("preview-tabs");
    var frameEl = document.getElementById("preview-frame");
    var wrapEl = document.getElementById("preview-wrap");
    var widthBtns = document.querySelectorAll("[data-width]");

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function frameSrc(mode) {
      return mode ? "index.html?preview=" + encodeURIComponent(mode) : "index.html";
    }

    function setMode(mode) {
      var state = loadState();
      state.mode = mode;
      saveState(state);
      frameEl.src = frameSrc(mode);

      tabsEl.querySelectorAll(".preview-bar__tab").forEach(function (btn) {
        btn.classList.toggle("is-active", btn.getAttribute("data-mode") === mode);
      });
    }

    function setWidth(width) {
      var state = loadState();
      state.width = width;
      saveState(state);
      wrapEl.classList.toggle("is-mobile", width === "390");

      widthBtns.forEach(function (btn) {
        btn.classList.toggle("is-active", btn.getAttribute("data-width") === width);
      });
    }

    PREVIEW_MODES.forEach(function (item) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "preview-bar__tab";
      btn.setAttribute("role", "tab");
      btn.setAttribute("data-mode", item.id);
      btn.textContent = item.label;
      btn.addEventListener("click", function () {
        setMode(item.id);
      });
      tabsEl.appendChild(btn);
    });

    widthBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        setWidth(btn.getAttribute("data-width"));
      });
    });

    var saved = loadState();
    setMode(saved.mode !== undefined ? saved.mode : DEFAULT_MODE);
    setWidth(saved.width || DEFAULT_WIDTH);
  </script>
</body>
</html>
