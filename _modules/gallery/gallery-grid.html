<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gallery-grid</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --gallery-color-bg: #fafafa;
      --gallery-color-text: #000000;
      --gallery-color-image: #efeff8;
      --gallery-font-size-title: 58px;
      --gallery-line-height-title: 1.4;
      --gallery-gap-head-track: 80px;
      --gallery-track-gap: 26px;
      --gallery-item-width: 560px;
      --gallery-item-height: 644px;
      --gallery-radius-image: 16px;
      --gallery-section-padding-top: 100px;
      --gallery-section-padding-bottom: 100px;
      --gallery-track-speed: 36s;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--gallery-color-text);
      overflow-x: hidden;
    }

    ul {
      list-style: none;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* GALLERY */
    .gallery-grid {
      background-color: var(--gallery-color-bg);
      padding: var(--gallery-section-padding-top) 0 var(--gallery-section-padding-bottom);
    }

    .gallery-grid__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--gallery-gap-head-track);
    }

    .gallery-grid__head {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      text-align: center;
    }

    .gallery-grid__title {
      font-size: var(--gallery-font-size-title);
      font-weight: 700;
      color: var(--gallery-color-text);
      line-height: var(--gallery-line-height-title);
    }

    .gallery-grid__stage {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      overflow: hidden;
    }

    .gallery-grid__track {
      display: flex;
      gap: var(--gallery-track-gap);
      width: max-content;
      animation: gallery-grid-scroll var(--gallery-track-speed) linear infinite;
      will-change: transform;
    }

    .gallery-grid__track:hover {
      animation-play-state: paused;
    }

    @keyframes gallery-grid-scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .gallery-grid__item {
      flex: 0 0 var(--gallery-item-width);
      width: var(--gallery-item-width);
      height: var(--gallery-item-height);
      border-radius: var(--gallery-radius-image);
      background-color: var(--gallery-color-image);
      overflow: hidden;
    }

    .gallery-grid__item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: var(--gallery-color-image);
    }

    @media (max-width: 768px) {
      .gallery-grid {
        padding: 60px 0 80px;
      }

      .gallery-grid__inner {
        gap: 40px;
      }

      .gallery-grid__title {
        font-size: 32px;
      }

      .gallery-grid__item {
        flex: 0 0 280px;
        width: 280px;
        height: 322px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-grid__track {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- GALLERY START -->
  <section class="gallery-grid fade-in">
    <div class="gallery-grid__inner">
      <header class="gallery-grid__head">
        <h2 class="gallery-grid__title">당신의 신체 데이터가 증명하는<br>완벽한 변화의 기록</h2>
      </header>

      <div class="gallery-grid__stage">
        <ul class="gallery-grid__track" aria-hidden="true">
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
          <li class="gallery-grid__item"></li>
        </ul>
      </div>
    </div>
  </section>
  <!-- GALLERY END -->

  <script>
    (function () {
      "use strict";

      var track = document.querySelector(".gallery-grid__track");

      if (track) {
        var items = Array.prototype.slice.call(track.children);

        items.forEach(function (item) {
          track.appendChild(item.cloneNode(true));
        });
      }

      var targets = document.querySelectorAll(".fade-in");

      if (targets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
