<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about-image</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --about-color-bg: #fafafa;
      --about-color-text: #000000;
      --about-color-image: #f3f3f9;
      --about-font-size-title: 54px;
      --about-font-size-desc: 24px;
      --about-line-height-title: 1.34;
      --about-line-height-desc: 1.58;
      --about-gap-title-desc: 26px;
      --about-gap-content-image: 80px;
      --about-visual-height-end: 785px;
      --about-visual-height-start: 420px;
      --about-section-padding-top: 100px;
      --about-expand-scroll: 720px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--about-color-text);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* ABOUT */
    .about-image {
      background-color: var(--about-color-bg);
    }

    .about-image__track {
      height: calc(100vh + var(--about-expand-scroll));
    }

    .about-image__sticky {
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: var(--about-gap-content-image);
      min-height: 100vh;
      padding-top: var(--about-section-padding-top);
      padding-bottom: 40px;
    }

    .about-image__content {
      width: 100%;
    }

    .about-image__title {
      max-width: 690px;
      font-size: var(--about-font-size-title);
      font-weight: 700;
      color: var(--about-color-text);
      line-height: var(--about-line-height-title);
      margin-bottom: var(--about-gap-title-desc);
    }

    .about-image__desc {
      max-width: 1200px;
      font-size: var(--about-font-size-desc);
      font-weight: 500;
      color: var(--about-color-text);
      line-height: var(--about-line-height-desc);
    }

    .about-image__visual-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .about-image__visual {
      width: 100%;
      height: var(--about-visual-height-start);
      background-color: var(--about-color-image);
      will-change: width, height;
    }

    .about-image__visual.is-full {
      width: 100vw;
      max-width: 100vw;
    }

    @media (max-width: 768px) {
      :root {
        --about-visual-height-end: 280px;
        --about-visual-height-start: 200px;
        --about-expand-scroll: 480px;
        --about-section-padding-top: 60px;
        --about-gap-content-image: 40px;
      }

      .about-image__title {
        font-size: 28px;
      }

      .about-image__desc {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ABOUT START -->
  <section class="about-image fade-in">
    <div class="about-image__track">
      <div class="about-image__sticky">
        <div class="wrap">
          <div class="about-image__content">
            <h2 class="about-image__title">기술로 건강의 문턱을 낮추다</h2>
            <p class="about-image__desc">
              복잡한 영양 정보와 운동 이론을 몰라도 괜찮습니다.<br>
              AI 코칭 시스템이 당신의 일상 속에서 가장 쉽고 지속 가능한 건강 습관을 만들어 드립니다.
            </p>
          </div>
        </div>

        <div class="about-image__visual-wrap">
          <div class="about-image__visual" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </section>
  <!-- ABOUT END -->

  <script>
    (function () {
      "use strict";

      var section = document.querySelector(".about-image");
      var track = document.querySelector(".about-image__track");
      var wrap = document.querySelector(".about-image .wrap");
      var visual = document.querySelector(".about-image__visual");
      var fadeTargets = document.querySelectorAll(".fade-in");

      if (!section || !track || !visual) return;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getSizes() {
        var styles = getComputedStyle(document.documentElement);
        return {
          heightStart: parseFloat(styles.getPropertyValue("--about-visual-height-start")),
          heightEnd: parseFloat(styles.getPropertyValue("--about-visual-height-end"))
        };
      }

      function updateVisual() {
        var trackTop = track.offsetTop;
        var trackHeight = track.offsetHeight;
        var viewportHeight = window.innerHeight;
        var scrollRange = Math.max(trackHeight - viewportHeight, 1);
        var scrolled = window.scrollY - trackTop;
        var progress = clamp(scrolled / scrollRange, 0, 1);
        var wrapWidth = wrap ? wrap.clientWidth : Math.min(1200, window.innerWidth);
        var fullWidth = window.innerWidth;
        var sizes = getSizes();
        var width = wrapWidth + (fullWidth - wrapWidth) * progress;
        var height = sizes.heightStart + (sizes.heightEnd - sizes.heightStart) * progress;

        visual.classList.toggle("is-full", progress >= 0.999);
        visual.style.width = progress >= 0.999 ? "100vw" : width + "px";
        visual.style.height = height + "px";
      }

      function onScroll() {
        updateVisual();
      }

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", updateVisual);
      updateVisual();

      if (fadeTargets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        fadeTargets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        fadeTargets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
