<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about-typo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --color-primary: #2abfb0;
      --color-white: #ffffff;
      --color-text: #1a1a2e;
      --color-bg-soft: #f4fdfb;
      --radius-btn: 6px;
      --radius-card: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--color-white);
    }

    ul {
      list-style: none;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* ABOUT */
    .about-typo {
      background-color: var(--color-text);
      padding: 120px 0;
    }

    .about-typo__inner {
      text-align: center;
    }

    .about-typo__label {
      font-size: 13px;
      color: var(--color-primary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .about-typo__headline {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 60px;
    }

    .about-typo__headline span {
      color: rgba(255, 255, 255, 0.9);
    }

    .about-typo__headline em {
      font-style: normal;
      color: var(--color-primary);
    }

    .about-typo__divider {
      width: 48px;
      height: 2px;
      background-color: var(--color-primary);
      margin: 40px auto;
    }

    .about-typo__desc {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.9;
      max-width: 600px;
      margin: 0 auto 40px;
    }

    .about-typo__stats {
      display: flex;
      justify-content: center;
      gap: 60px;
    }

    .about-typo__stat-num {
      font-size: 40px;
      font-weight: 700;
      color: var(--color-white);
      line-height: 1.2;
    }

    .about-typo__stat-unit {
      color: var(--color-primary);
    }

    .about-typo__stat-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .about-typo {
        padding: 80px 0;
      }

      .about-typo__headline {
        font-size: 36px;
        margin-bottom: 40px;
      }

      .about-typo__desc {
        font-size: 14px;
      }

      .about-typo__stats {
        flex-direction: column;
        gap: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- ABOUT START -->
  <section class="about-typo fade-in">
    <div class="wrap">
      <div class="about-typo__inner">
        <p class="about-typo__label">ABOUT US</p>

        <h2 class="about-typo__headline">
          <span>우리는 </span><em>다른 방식으로</em><br>
          <em>더 나은 결과를</em><br>
          <span>만들어냅니다</span>
        </h2>

        <div class="about-typo__divider"></div>

        <p class="about-typo__desc">
          우리는 고객의 가치를 최우선으로 생각합니다.<br>
          차별화된 접근 방식으로 더 나은 경험을 제공하며,<br>
          지속적인 혁신을 통해 성장해 나가고 있습니다.
        </p>

        <ul class="about-typo__stats">
          <li>
            <p class="about-typo__stat-num">10<span class="about-typo__stat-unit">+</span></p>
            <p class="about-typo__stat-label">항목1</p>
          </li>
          <li>
            <p class="about-typo__stat-num">500<span class="about-typo__stat-unit">+</span></p>
            <p class="about-typo__stat-label">항목2</p>
          </li>
          <li>
            <p class="about-typo__stat-num">99<span class="about-typo__stat-unit">%</span></p>
            <p class="about-typo__stat-label">항목3</p>
          </li>
        </ul>
      </div>
    </div>
  </section>
  <!-- ABOUT END -->

  <script>
    (function () {
      "use strict";

      var targets = document.querySelectorAll(".fade-in");

      if (targets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
