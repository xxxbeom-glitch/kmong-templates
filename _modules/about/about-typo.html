<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about-typo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --about-color-bg: #fafafa;
      --about-color-text: #000000;
      --about-color-image: #f3f3f9;
      --about-font-size-title: 58px;
      --about-font-size-desc: 24px;
      --about-line-height-title: 1.4;
      --about-line-height-desc: 1.58;
      --about-gap-title-desc: 26px;
      --about-gap-content-gallery: 80px;
      --about-gallery-gap: 24px;
      --about-gallery-item-width: 540px;
      --about-gallery-item-height: 398px;
      --about-radius-image: 16px;
      --about-section-padding-top: 100px;
      --about-section-padding-bottom: 181px;
      --about-gallery-speed: 36s;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--about-color-text);
      overflow-x: hidden;
    }

    ul {
      list-style: none;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* ABOUT */
    .about-typo {
      background-color: var(--about-color-bg);
      padding: var(--about-section-padding-top) 0 var(--about-section-padding-bottom);
    }

    .about-typo__inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--about-gap-content-gallery);
    }

    .about-typo__content {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      text-align: center;
    }

    .about-typo__title {
      font-size: var(--about-font-size-title);
      font-weight: 700;
      color: var(--about-color-text);
      line-height: var(--about-line-height-title);
      margin-bottom: var(--about-gap-title-desc);
    }

    .about-typo__desc {
      font-size: var(--about-font-size-desc);
      font-weight: 500;
      color: var(--about-color-text);
      line-height: var(--about-line-height-desc);
    }

    .about-typo__gallery {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      overflow: hidden;
    }

    .about-typo__gallery-track {
      display: flex;
      gap: var(--about-gallery-gap);
      width: max-content;
      animation: about-typo-scroll var(--about-gallery-speed) linear infinite;
    }

    .about-typo__gallery-track:hover {
      animation-play-state: paused;
    }

    @keyframes about-typo-scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .about-typo__gallery-item {
      flex: 0 0 var(--about-gallery-item-width);
      width: var(--about-gallery-item-width);
      height: var(--about-gallery-item-height);
      border-radius: var(--about-radius-image);
      background-color: var(--about-color-image);
      overflow: hidden;
    }

    .about-typo__gallery-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: var(--about-color-image);
    }

    @media (max-width: 768px) {
      .about-typo {
        padding: 60px 0 80px;
      }

      .about-typo__inner {
        gap: 40px;
      }

      .about-typo__title {
        font-size: 32px;
      }

      .about-typo__desc {
        font-size: 16px;
      }

      .about-typo__gallery-item {
        flex: 0 0 280px;
        width: 280px;
        height: 206px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .about-typo__gallery-track {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <!-- ABOUT START -->
  <section class="about-typo fade-in">
    <div class="about-typo__inner">
      <div class="about-typo__content">
        <h2 class="about-typo__title">기술로 건강의 문턱을 낮추다</h2>
        <p class="about-typo__desc">
          복잡한 영양 정보와 운동 이론을 몰라도 괜찮습니다.<br>
          AI 코칭 시스템이 당신의 일상 속에서 가장 쉽고 지속 가능한 건강 습관을 만들어 드립니다.
        </p>
      </div>

      <div class="about-typo__gallery">
        <ul class="about-typo__gallery-track" aria-hidden="true">
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
          <li class="about-typo__gallery-item"></li>
        </ul>
      </div>
    </div>
  </section>
  <!-- ABOUT END -->

  <script>
    (function () {
      "use strict";

      var targets = document.querySelectorAll(".fade-in");

      if (targets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
