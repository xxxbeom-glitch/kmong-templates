<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kv-full</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --kv-color-bg: #fafafa;
      --kv-color-text: #000000;
      --kv-color-primary: #3842ff;
      --kv-color-btn-secondary: #e5e8ee;
      --kv-color-logo: #e3e5eb;
      --kv-font-size-title: 70px;
      --kv-font-size-desc: 26px;
      --kv-font-size-nav: 20px;
      --kv-font-size-btn: 24px;
      --kv-line-height-title: 1.44;
      --kv-line-height-desc: 1.5;
      --kv-line-height-nav: 1.5;
      --kv-line-height-btn: 1.5;
      --kv-gap-title-desc: 32px;
      --kv-gap-copy-btns: 52px;
      --kv-gap-btns: 18px;
      --kv-gap-nav: 36px;
      --kv-radius-btn: 12px;
      --kv-radius-logo: 0;
      --kv-btn-min-width: 168px;
      --kv-btn-height: 74px;
      --kv-logo-width: 180px;
      --kv-logo-height: 76px;
      --kv-header-height: 76px;
      --kv-section-min-height: 100vh;
      --kv-padding-top: 36px;
      --kv-wrap-width: 1200px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--kv-color-text);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
      font: inherit;
    }

    .wrap {
      max-width: var(--kv-wrap-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER */
    .kv-header {
      flex-shrink: 0;
    }

    .kv-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--kv-header-height);
      gap: 24px;
    }

    .kv-header__logo {
      display: block;
      flex-shrink: 0;
      width: var(--kv-logo-width);
      height: var(--kv-logo-height);
      background-color: var(--kv-color-logo);
      border-radius: var(--kv-radius-logo);
    }

    .kv-header__nav {
      display: flex;
      align-items: center;
      gap: var(--kv-gap-nav);
      margin-left: auto;
    }

    .kv-header__nav a {
      font-size: var(--kv-font-size-nav);
      font-weight: 500;
      color: var(--kv-color-text);
      line-height: var(--kv-line-height-nav);
      white-space: nowrap;
    }

    .kv-header__nav a:hover {
      color: var(--kv-color-primary);
    }

    .kv-header__hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .kv-header__hamburger span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: var(--kv-color-text);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .kv-header.is-open .kv-header__hamburger span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .kv-header.is-open .kv-header__hamburger span:nth-child(2) {
      opacity: 0;
    }

    .kv-header.is-open .kv-header__hamburger span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .kv-header__overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background-color: var(--kv-color-text);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .kv-header__overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .kv-header__overlay-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .kv-header__overlay-nav a {
      font-size: 24px;
      font-weight: 500;
      color: #ffffff;
    }

    /* KV */
    .kv-full {
      display: flex;
      flex-direction: column;
      height: var(--kv-section-min-height);
      min-height: var(--kv-section-min-height);
      background-color: var(--kv-color-bg);
      padding-top: var(--kv-padding-top);
    }

    .kv-full__body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .kv-full__copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--kv-gap-copy-btns);
      max-width: 893px;
    }

    .kv-full__text {
      display: flex;
      flex-direction: column;
      gap: var(--kv-gap-title-desc);
    }

    .kv-full__title {
      font-size: var(--kv-font-size-title);
      font-weight: 700;
      color: var(--kv-color-text);
      line-height: var(--kv-line-height-title);
    }

    .kv-full__desc {
      font-size: var(--kv-font-size-desc);
      font-weight: 500;
      color: var(--kv-color-text);
      line-height: var(--kv-line-height-desc);
    }

    .kv-full__btns {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--kv-gap-btns);
    }

    .kv-full__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--kv-btn-min-width);
      min-height: var(--kv-btn-height);
      padding: 10px 24px;
      border-radius: var(--kv-radius-btn);
      font-size: var(--kv-font-size-btn);
      font-weight: 500;
      line-height: var(--kv-line-height-btn);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .kv-full__btn:hover {
      transform: translateY(-2px);
    }

    .kv-full__btn--primary {
      background-color: var(--kv-color-primary);
      color: #ffffff;
    }

    .kv-full__btn--secondary {
      background-color: var(--kv-color-btn-secondary);
      color: var(--kv-color-text);
    }

    @media (max-width: 768px) {
      .kv-full {
        height: 100vh;
        min-height: 100vh;
        padding-top: 20px;
      }

      .kv-header__nav {
        display: none;
      }

      .kv-header__hamburger {
        display: flex;
      }

      .kv-full__title {
        font-size: 36px;
      }

      .kv-full__desc {
        font-size: 18px;
      }

      .kv-full__btns {
        flex-direction: column;
        width: 100%;
      }

      .kv-full__btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- KV START -->
  <section class="kv-full">
    <header class="kv-header">
      <div class="wrap">
        <a href="/" class="kv-header__logo" aria-label="로고"></a>

        <nav class="kv-header__nav">
          <a href="#">첫번째 메뉴</a>
          <a href="#">두번째 메뉴</a>
          <a href="#">세번째 메뉴</a>
          <a href="#">네번째 메뉴</a>
        </nav>

        <button type="button" class="kv-header__hamburger" aria-label="메뉴 열기">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="kv-header__overlay">
        <nav class="kv-header__overlay-nav">
          <a href="#">첫번째 메뉴</a>
          <a href="#">두번째 메뉴</a>
          <a href="#">세번째 메뉴</a>
          <a href="#">네번째 메뉴</a>
        </nav>
      </div>
    </header>

    <div class="wrap kv-full__body">
      <div class="kv-full__copy">
        <div class="kv-full__text">
          <h1 class="kv-full__title">데이터가 만드는 최적의 피지컬,<br>나만을 위한 AI 코치</h1>
          <p class="kv-full__desc">당신의 체성분과 생활 패턴을 정밀하게 분석하여 가장 효율적인 식단과<br>운동 루틴을 설계해요</p>
        </div>
        <div class="kv-full__btns">
          <a href="#" class="kv-full__btn kv-full__btn--primary">시작하기</a>
          <a href="#" class="kv-full__btn kv-full__btn--secondary">더 알아보기</a>
        </div>
      </div>
    </div>
  </section>
  <!-- KV END -->

  <script>
    (function () {
      "use strict";

      var header = document.querySelector(".kv-header");
      var hamburger = document.querySelector(".kv-header__hamburger");
      var overlay = document.querySelector(".kv-header__overlay");
      var overlayLinks = document.querySelectorAll(".kv-header__overlay-nav a");

      function closeOverlay() {
        if (!overlay || !header) return;
        overlay.classList.remove("open");
        header.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      function openOverlay() {
        if (!overlay || !header) return;
        overlay.classList.add("open");
        header.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      if (hamburger && overlay) {
        hamburger.addEventListener("click", function () {
          if (overlay.classList.contains("open")) {
            closeOverlay();
          } else {
            openOverlay();
          }
        });
      }

      overlayLinks.forEach(function (link) {
        link.addEventListener("click", closeOverlay);
      });
    })();
  </script>
</body>
</html>
