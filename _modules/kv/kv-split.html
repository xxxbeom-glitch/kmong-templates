<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kv-split</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --color-primary: #2abfb0;
      --color-white: #ffffff;
      --color-text: #1a1a2e;
      --color-bg-soft: #f4fdfb;
      --radius-btn: 6px;
      --radius-card: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--color-text);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
      font: inherit;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* HEADER */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background-color: var(--color-white);
      transition: box-shadow 0.3s ease;
    }

    .header.scrolled {
      box-shadow: 0 2px 12px rgba(26, 26, 46, 0.08);
    }

    .header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
      gap: 24px;
    }

    .header__logo img {
      display: block;
      width: 120px;
      height: 40px;
      background-color: #c8d8d6;
      border-radius: 4px;
    }

    .header__nav {
      display: flex;
      align-items: center;
      gap: 36px;
      margin-left: auto;
    }

    .header__nav a {
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text);
      transition: color 0.3s ease;
    }

    .header__nav a:hover {
      color: var(--color-primary);
    }

    .header__cta {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: var(--radius-btn);
      background-color: var(--color-primary);
      color: var(--color-white);
      font-size: 15px;
      font-weight: 600;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .hamburger span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: var(--color-text);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .header.is-open .hamburger span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }

    .header.is-open .hamburger span:nth-child(2) {
      opacity: 0;
    }

    .header.is-open .hamburger span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background-color: var(--color-text);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .nav-overlay__nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .nav-overlay__nav a {
      font-size: 24px;
      font-weight: 500;
      color: var(--color-white);
    }

    .nav-overlay__cta {
      padding: 12px 28px;
      border-radius: var(--radius-btn);
      background-color: var(--color-primary);
      color: var(--color-white);
      font-size: 16px;
      font-weight: 600;
    }

    /* KV */
    .kv-split {
      width: 100%;
      height: 800px;
      padding-top: 80px;
    }

    .kv-split__inner {
      display: flex;
      height: 100%;
      max-width: none;
      padding: 0;
    }

    .kv-split__text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      background-color: var(--color-bg-soft);
    }

    .kv-split__sub {
      font-size: 13px;
      font-weight: 300;
      color: var(--color-primary);
      letter-spacing: 0.1em;
      text-transform: lowercase;
      margin-bottom: 16px;
    }

    .kv-split__title {
      font-size: 48px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .kv-split__desc {
      font-size: 15px;
      font-weight: 300;
      color: var(--color-text);
      opacity: 0.6;
      margin-bottom: 40px;
    }

    .kv-split__btns {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kv-split__btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: var(--radius-btn);
      font-size: 0.9375rem;
      font-weight: 500;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .kv-split__btn:hover {
      transform: translateY(-2px);
    }

    .kv-split__btn--primary {
      background-color: var(--color-primary);
      color: var(--color-white);
    }

    .kv-split__btn--outline {
      border: 2px solid var(--color-primary);
      background-color: transparent;
      color: var(--color-primary);
    }

    .kv-split__btn--outline:hover {
      background-color: var(--color-primary);
      color: var(--color-white);
    }

    .kv-split__visual {
      flex: 1;
      background-color: #c8d8d6;
      background-size: cover;
      background-position: center;
    }

    @media (max-width: 768px) {
      .header .wrap {
        height: 60px;
      }

      .header__nav,
      .header__cta {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .kv-split {
        height: auto;
        padding-top: 60px;
      }

      .kv-split__inner {
        flex-direction: column;
        height: auto;
      }

      .kv-split__visual {
        order: -1;
        flex: none;
        width: 100%;
        height: 300px;
      }

      .kv-split__text {
        padding: 40px 20px;
      }

      .kv-split__sub {
        font-size: 11px;
      }

      .kv-split__title {
        font-size: 32px;
      }

      .kv-split__desc {
        font-size: 13px;
      }

      .kv-split__btns {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }

      .kv-split__btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER START -->
  <header class="header">
    <div class="wrap">
      <a href="/" class="header__logo">
        <img src="" alt="로고">
      </a>

      <nav class="header__nav">
        <a href="#">메뉴1</a>
        <a href="#">메뉴2</a>
        <a href="#">메뉴3</a>
        <a href="#">메뉴4</a>
      </nav>

      <a href="#" class="header__cta">문의하기</a>

      <button type="button" class="hamburger" aria-label="메뉴 열기">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="nav-overlay">
      <nav class="nav-overlay__nav">
        <a href="#">메뉴1</a>
        <a href="#">메뉴2</a>
        <a href="#">메뉴3</a>
        <a href="#">메뉴4</a>
      </nav>
      <a href="#" class="nav-overlay__cta">문의하기</a>
    </div>
  </header>
  <!-- HEADER END -->

  <!-- KV START -->
  <main>
    <section class="kv-split">
      <div class="wrap kv-split__inner">
        <div class="kv-split__text">
          <p class="kv-split__sub">Subtitle Text</p>
          <h1 class="kv-split__title">메인 타이틀을<br>입력하세요</h1>
          <p class="kv-split__desc">서브 타이틀 또는 간단한 설명 문구를 입력합니다</p>
          <div class="kv-split__btns">
            <a href="#" class="kv-split__btn kv-split__btn--primary">시작하기</a>
            <a href="#" class="kv-split__btn kv-split__btn--outline">더 알아보기</a>
          </div>
        </div>
        <div class="kv-split__visual" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <!-- KV END -->

  <script>
    (function () {
      "use strict";

      var header = document.querySelector(".header");
      var hamburger = document.querySelector(".hamburger");
      var navOverlay = document.querySelector(".nav-overlay");
      var overlayLinks = document.querySelectorAll(".nav-overlay__nav a, .nav-overlay__cta");

      function closeOverlay() {
        navOverlay.classList.remove("open");
        header.classList.remove("is-open");
        document.body.style.overflow = "";
      }

      function openOverlay() {
        navOverlay.classList.add("open");
        header.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }

      if (hamburger && navOverlay) {
        hamburger.addEventListener("click", function () {
          if (navOverlay.classList.contains("open")) {
            closeOverlay();
          } else {
            openOverlay();
          }
        });
      }

      overlayLinks.forEach(function (link) {
        link.addEventListener("click", closeOverlay);
      });

      function onScroll() {
        var scrollY = window.scrollY || window.pageYOffset;

        if (header) {
          if (scrollY >= 50) {
            header.classList.add("scrolled");
          } else {
            header.classList.remove("scrolled");
          }
        }
      }

      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    })();
  </script>
</body>
</html>
