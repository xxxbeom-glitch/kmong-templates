<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>team-card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --team-color-bg: #fafafa;
      --team-color-text: #000000;
      --team-color-nav: #d9d9d9;
      --team-font-size-name: 54px;
      --team-font-size-tags: 28px;
      --team-font-size-career: 24px;
      --team-line-height-name: 1.34;
      --team-line-height-tags: 1.58;
      --team-line-height-career: 1.58;
      --team-gap-name-tags: 12px;
      --team-gap-profile-career: 26px;
      --team-gap-career-lines: 8px;
      --team-gap-content-nav: 80px;
      --team-content-max-width: 690px;
      --team-nav-size: 64px;
      --team-nav-gap: 20px;
      --team-section-min-height: 1086px;
      --team-section-padding-y: 100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--team-color-text);
    }

    button {
      border: none;
      background: none;
      cursor: pointer;
      font: inherit;
    }

    ul {
      list-style: none;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* TEAM */
    .team-card {
      background-color: var(--team-color-bg);
    }

    .team-card__inner {
      display: grid;
      grid-template-columns: 6fr 4fr;
      min-height: var(--team-section-min-height);
    }

    .team-card__content-wrap {
      display: flex;
      align-items: flex-start;
      min-height: var(--team-section-min-height);
      padding: var(--team-section-padding-y) 0;
    }

    .team-card__content {
      display: flex;
      flex-direction: column;
      gap: var(--team-gap-content-nav);
      width: 100%;
      max-width: var(--team-content-max-width);
    }

    .team-card__profile {
      display: flex;
      flex-direction: column;
      gap: var(--team-gap-profile-career);
    }

    .team-card__intro {
      display: flex;
      flex-direction: column;
      gap: var(--team-gap-name-tags);
    }

    .team-card__name {
      font-size: var(--team-font-size-name);
      font-weight: 700;
      color: var(--team-color-text);
      line-height: var(--team-line-height-name);
      transition: opacity 0.35s ease;
    }

    .team-card__tags {
      font-size: var(--team-font-size-tags);
      font-weight: 700;
      color: var(--team-color-text);
      line-height: var(--team-line-height-tags);
      transition: opacity 0.35s ease;
    }

    .team-card__career {
      display: flex;
      flex-direction: column;
      gap: var(--team-gap-career-lines);
      transition: opacity 0.35s ease;
    }

    .team-card__career li {
      font-size: var(--team-font-size-career);
      font-weight: 500;
      color: var(--team-color-text);
      line-height: var(--team-line-height-career);
    }

    .team-card__nav {
      display: flex;
      align-items: center;
      gap: var(--team-nav-gap);
    }

    .team-card__nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--team-nav-size);
      height: var(--team-nav-size);
      background-color: var(--team-color-nav);
      color: var(--team-color-text);
      transition: opacity 0.2s ease;
    }

    .team-card__nav-btn:hover {
      opacity: 0.85;
    }

    .team-card__nav-btn::before {
      content: "";
      display: block;
      width: 12px;
      height: 12px;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
    }

    .team-card__nav-btn--prev::before {
      transform: rotate(-135deg);
      margin-left: 4px;
    }

    .team-card__nav-btn--next::before {
      transform: rotate(45deg);
      margin-right: 4px;
    }

    .team-card__visual {
      position: relative;
      min-height: var(--team-section-min-height);
      overflow: hidden;
      background-color: var(--team-color-nav);
    }

    .team-card__photo {
      display: block;
      width: 100%;
      height: 100%;
      min-height: var(--team-section-min-height);
      object-fit: cover;
      object-position: center top;
      transition: opacity 0.4s ease;
    }

    .team-card__content.is-fading .team-card__name,
    .team-card__content.is-fading .team-card__tags,
    .team-card__content.is-fading .team-card__career {
      opacity: 0;
    }

    .team-card__photo.is-fading {
      opacity: 0;
    }

    @media (max-width: 768px) {
      .team-card__inner {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .team-card__content-wrap {
        min-height: auto;
        padding: 60px 0 40px;
      }

      .team-card__name {
        font-size: 32px;
      }

      .team-card__tags {
        font-size: 18px;
      }

      .team-card__career li {
        font-size: 16px;
      }

      .team-card__nav-btn {
        width: 48px;
        height: 48px;
      }

      .team-card__visual {
        min-height: 420px;
      }

      .team-card__photo {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>

  <!-- TEAM START -->
  <section class="team-card fade-in">
    <div class="team-card__inner">
      <div class="wrap team-card__content-wrap">
        <div class="team-card__content">
          <div class="team-card__profile">
            <div class="team-card__intro">
              <h2 class="team-card__name">김유진 수석코치</h2>
              <p class="team-card__tags">#스포츠영양학 #체형교정 #데이터분석</p>
            </div>
            <ul class="team-card__career">
              <li>서울대학교 체육교육학 석사</li>
              <li>현) AI 피트니스 알고리즘 수석 연구원</li>
            </ul>
          </div>

          <div class="team-card__nav">
            <button type="button" class="team-card__nav-btn team-card__nav-btn--prev" aria-label="이전 팀원"></button>
            <button type="button" class="team-card__nav-btn team-card__nav-btn--next" aria-label="다음 팀원"></button>
          </div>
        </div>
      </div>

      <div class="team-card__visual">
        <img class="team-card__photo" src="../../_imgs/team_01.jpg" alt="김유진 수석코치 프로필">
      </div>
    </div>
  </section>
  <!-- TEAM END -->

  <script>
    (function () {
      "use strict";

      var members = [
        {
          name: "김유진 수석코치",
          tags: "#스포츠영양학 #체형교정 #데이터분석",
          career: ["서울대학교 체육교육학 석사", "현) AI 피트니스 알고리즘 수석 연구원"],
          image: "../../_imgs/team_01.jpg",
          alt: "김유진 수석코치 프로필"
        },
        {
          name: "이준호 수석코치",
          tags: "#근력트레이닝 #재활운동 #바디프로필",
          career: ["연세대학교 스포츠레저학 박사", "현) 퍼포먼스 트레이닝 총괄 코치"],
          image: "../../_imgs/team_02.jpg",
          alt: "이준호 수석코치 프로필"
        },
        {
          name: "최서연 코치",
          tags: "#필라테스 #체형분석 #재활케어",
          career: ["이화여자대학교 운동건강관리학 석사", "현) 체형 교정 프로그램 리드 코치"],
          image: "../../_imgs/team_03.jpg",
          alt: "최서연 코치 프로필"
        },
        {
          name: "정도현 코치",
          tags: "#다이어트 #대사관리 #생활습관",
          career: ["고려대학교 스포츠의학 석사", "현) 라이프스타일 코칭 팀장"],
          image: "../../_imgs/team_04.jpg",
          alt: "정도현 코치 프로필"
        },
        {
          name: "한지우 코치",
          tags: "#영양코칭 #식단설계 #웰니스",
          career: ["성균관대학교 식품영양학 석사", "현) 맞춤 영양 솔루션 수석 코치"],
          image: "../../_imgs/team_05.jpg",
          alt: "한지우 코치 프로필"
        }
      ];

      var index = 0;
      var content = document.querySelector(".team-card__content");
      var nameEl = document.querySelector(".team-card__name");
      var tagsEl = document.querySelector(".team-card__tags");
      var careerEl = document.querySelector(".team-card__career");
      var photoEl = document.querySelector(".team-card__photo");
      var prevBtn = document.querySelector(".team-card__nav-btn--prev");
      var nextBtn = document.querySelector(".team-card__nav-btn--next");
      var fadeTargets = document.querySelectorAll(".fade-in");

      if (!content || !nameEl || !tagsEl || !careerEl || !photoEl) return;

      function renderCareer(lines) {
        careerEl.innerHTML = "";
        lines.forEach(function (line) {
          var li = document.createElement("li");
          li.textContent = line;
          careerEl.appendChild(li);
        });
      }

      function applyMember(i) {
        var member = members[i];
        nameEl.textContent = member.name;
        tagsEl.textContent = member.tags;
        renderCareer(member.career);
        photoEl.src = member.image;
        photoEl.alt = member.alt;
      }

      function changeSlide(direction) {
        var nextIndex = index + direction;
        if (nextIndex < 0) nextIndex = members.length - 1;
        if (nextIndex >= members.length) nextIndex = 0;

        content.classList.add("is-fading");
        photoEl.classList.add("is-fading");

        window.setTimeout(function () {
          index = nextIndex;
          applyMember(index);
          content.classList.remove("is-fading");
          photoEl.classList.remove("is-fading");
        }, 200);
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          changeSlide(-1);
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          changeSlide(1);
        });
      }

      applyMember(index);

      if (fadeTargets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        fadeTargets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        fadeTargets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
