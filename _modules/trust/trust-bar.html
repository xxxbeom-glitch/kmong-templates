<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trust-bar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --trust-color-bg: #fafafa;
      --trust-color-text: #000000;
      --trust-color-visual: #d9d9d9;
      --trust-font-size-title: 54px;
      --trust-font-size-desc: 24px;
      --trust-font-size-label: 24px;
      --trust-font-size-value: 36px;
      --trust-line-height-title: 1.34;
      --trust-line-height-desc: 1.58;
      --trust-line-height-label: 1.58;
      --trust-line-height-value: 1.58;
      --trust-gap-title-desc: 26px;
      --trust-gap-copy-stats: 48px;
      --trust-gap-stats: 26px;
      --trust-gap-label-value: 6px;
      --trust-content-max-width: 690px;
      --trust-section-min-height: 1148px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--trust-color-text);
    }

    ul {
      list-style: none;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* TRUST */
    .trust-bar {
      background-color: var(--trust-color-bg);
    }

    .trust-bar__inner {
      display: grid;
      grid-template-columns: 6fr 4fr;
      min-height: var(--trust-section-min-height);
    }

    .trust-bar__content-wrap {
      display: flex;
      align-items: center;
      min-height: var(--trust-section-min-height);
    }

    .trust-bar__content {
      width: 100%;
      max-width: var(--trust-content-max-width);
    }

    .trust-bar__head {
      margin-bottom: var(--trust-gap-copy-stats);
    }

    .trust-bar__title {
      font-size: var(--trust-font-size-title);
      font-weight: 700;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-title);
      margin-bottom: var(--trust-gap-title-desc);
    }

    .trust-bar__desc {
      font-size: var(--trust-font-size-desc);
      font-weight: 500;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-desc);
    }

    .trust-bar__stats {
      display: flex;
      align-items: flex-start;
      gap: var(--trust-gap-stats);
    }

    .trust-bar__stat {
      display: flex;
      flex-direction: column;
      gap: var(--trust-gap-label-value);
    }

    .trust-bar__label {
      font-size: var(--trust-font-size-label);
      font-weight: 500;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-label);
    }

    .trust-bar__value {
      font-size: var(--trust-font-size-value);
      font-weight: 800;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-value);
    }

    .trust-bar__visual {
      min-height: var(--trust-section-min-height);
      background-color: var(--trust-color-visual);
    }

    @media (max-width: 768px) {
      .trust-bar__inner {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .trust-bar__content-wrap {
        min-height: auto;
        padding: 60px 0 40px;
      }

      .trust-bar__title {
        font-size: 32px;
      }

      .trust-bar__desc {
        font-size: 16px;
      }

      .trust-bar__stats {
        flex-direction: column;
        gap: 24px;
      }

      .trust-bar__value {
        font-size: 28px;
      }

      .trust-bar__visual {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- TRUST START -->
  <section class="trust-bar fade-in">
    <div class="trust-bar__inner">
      <div class="wrap trust-bar__content-wrap">
        <div class="trust-bar__content">
          <div class="trust-bar__head">
            <h2 class="trust-bar__title">데이터로 증명하는<br>압도적인 신체 변화</h2>
            <p class="trust-bar__desc">
              단순히 굶는 다이어트가 아닌, 영양학적 근거와 과학적 트레이닝과<br>
              개인의 대사율에 최적화된 독자적인 알고리즘으로 체계적인 성장
            </p>
          </div>

          <ul class="trust-bar__stats">
            <li class="trust-bar__stat">
              <p class="trust-bar__label">누적 고객수</p>
              <p class="trust-bar__value" data-count="150000" data-suffix="+" data-comma="true">0+</p>
            </li>
            <li class="trust-bar__stat">
              <p class="trust-bar__label">누적 판매량</p>
              <p class="trust-bar__value" data-count="1000000" data-suffix="+" data-comma="true">0+</p>
            </li>
          </ul>
        </div>
      </div>

      <div class="trust-bar__visual" aria-hidden="true"></div>
    </div>
  </section>
  <!-- TRUST END -->

  <script>
    (function () {
      "use strict";

      var DURATION = 1600;

      function formatCount(value, useComma) {
        if (!useComma) return String(value);
        return value.toLocaleString("ko-KR");
      }

      function setCountValue(el, value) {
        var suffix = el.getAttribute("data-suffix") || "";
        var prefix = el.getAttribute("data-prefix") || "";
        var useComma = el.getAttribute("data-comma") === "true";
        el.textContent = prefix + formatCount(value, useComma) + suffix;
      }

      function animateCount(el) {
        var target = Number(el.getAttribute("data-count"));
        if (!target) return;

        var startTime = null;

        function step(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = Math.min((timestamp - startTime) / DURATION, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var current = Math.round(target * eased);
          setCountValue(el, current);

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            setCountValue(el, target);
          }
        }

        requestAnimationFrame(step);
      }

      function startCounters(section) {
        var counters = section.querySelectorAll("[data-count]");
        counters.forEach(function (el) {
          if (el.dataset.counted === "true") return;
          el.dataset.counted = "true";
          animateCount(el);
        });
      }

      function revealSection(section) {
        section.classList.add("visible");
        startCounters(section);
      }

      var targets = document.querySelectorAll(".fade-in");
      var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (targets.length === 0) return;

      if (prefersReducedMotion) {
        targets.forEach(function (el) {
          revealSection(el);
          el.querySelectorAll("[data-count]").forEach(function (counter) {
            setCountValue(counter, Number(counter.getAttribute("data-count")));
          });
        });
        return;
      }

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                revealSection(entry.target);
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.2 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          revealSection(el);
        });
      }
    })();
  </script>
</body>
</html>
