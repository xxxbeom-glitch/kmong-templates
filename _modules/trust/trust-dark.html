<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trust-dark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --trust-color-bg: #fafafa;
      --trust-color-text: #000000;
      --trust-color-card: #f3f3f9;
      --trust-font-size-title: 58px;
      --trust-font-size-desc: 24px;
      --trust-font-size-label: 24px;
      --trust-font-size-value: 44px;
      --trust-line-height-title: 1.4;
      --trust-line-height-desc: 1.58;
      --trust-line-height-label: 1.58;
      --trust-line-height-value: 1.58;
      --trust-gap-title-desc: 26px;
      --trust-gap-head-grid: 80px;
      --trust-grid-gap: 24px;
      --trust-gap-label-value: 6px;
      --trust-card-height: 290px;
      --trust-radius-card: 12px;
      --trust-section-padding-top: 100px;
      --trust-section-padding-bottom: 181px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--trust-color-text);
    }

    ul {
      list-style: none;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* TRUST */
    .trust-dark {
      background-color: var(--trust-color-bg);
      padding: var(--trust-section-padding-top) 0 var(--trust-section-padding-bottom);
    }

    .trust-dark__head {
      text-align: center;
      margin-bottom: var(--trust-gap-head-grid);
    }

    .trust-dark__title {
      font-size: var(--trust-font-size-title);
      font-weight: 700;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-title);
      margin-bottom: var(--trust-gap-title-desc);
    }

    .trust-dark__desc {
      font-size: var(--trust-font-size-desc);
      font-weight: 500;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-desc);
    }

    .trust-dark__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--trust-grid-gap);
    }

    .trust-dark__card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--trust-gap-label-value);
      min-height: var(--trust-card-height);
      padding: 24px;
      border-radius: var(--trust-radius-card);
      background-color: var(--trust-color-card);
      text-align: center;
    }

    .trust-dark__label {
      font-size: var(--trust-font-size-label);
      font-weight: 500;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-label);
    }

    .trust-dark__value {
      font-size: var(--trust-font-size-value);
      font-weight: 800;
      color: var(--trust-color-text);
      line-height: var(--trust-line-height-value);
    }

    @media (max-width: 768px) {
      .trust-dark {
        padding: 60px 0 80px;
      }

      .trust-dark__head {
        margin-bottom: 40px;
      }

      .trust-dark__title {
        font-size: 32px;
      }

      .trust-dark__desc {
        font-size: 16px;
      }

      .trust-dark__grid {
        grid-template-columns: 1fr;
      }

      .trust-dark__card {
        min-height: 220px;
      }

      .trust-dark__value {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- TRUST START -->
  <section class="trust-dark fade-in">
    <div class="wrap">
      <div class="trust-dark__head">
        <h2 class="trust-dark__title">데이터로 증명하는 압도적인 신체 변화</h2>
        <p class="trust-dark__desc">
          단순히 굶는 다이어트가 아닌, 영양학적 근거와 과학적 트레이닝과<br>
          개인의 대사율에 최적화된 독자적인 알고리즘으로 체계적인 성장
        </p>
      </div>

      <ul class="trust-dark__grid">
        <li class="trust-dark__card">
          <p class="trust-dark__label">설립년도</p>
          <p class="trust-dark__value" data-count="2021" data-suffix="년">0년</p>
        </li>
        <li class="trust-dark__card">
          <p class="trust-dark__label">프로젝트 수</p>
          <p class="trust-dark__value" data-count="1500" data-suffix="+">0+</p>
        </li>
        <li class="trust-dark__card">
          <p class="trust-dark__label">고객만족도</p>
          <p class="trust-dark__value" data-count="99" data-suffix="%">0%</p>
        </li>
        <li class="trust-dark__card">
          <p class="trust-dark__label">월 평균 문의수</p>
          <p class="trust-dark__value" data-count="25000" data-suffix="건+" data-comma="true">0건+</p>
        </li>
        <li class="trust-dark__card">
          <p class="trust-dark__label">누적 판매량</p>
          <p class="trust-dark__value" data-count="300000" data-suffix="건+" data-comma="true">0건+</p>
        </li>
        <li class="trust-dark__card">
          <p class="trust-dark__label">직원수</p>
          <p class="trust-dark__value" data-count="350" data-suffix="명">0명</p>
        </li>
      </ul>
    </div>
  </section>
  <!-- TRUST END -->

  <script>
    (function () {
      "use strict";

      var DURATION = 1600;

      function formatCount(value, useComma) {
        if (!useComma) return String(value);
        return value.toLocaleString("ko-KR");
      }

      function setCountValue(el, value) {
        var suffix = el.getAttribute("data-suffix") || "";
        var prefix = el.getAttribute("data-prefix") || "";
        var useComma = el.getAttribute("data-comma") === "true";
        el.textContent = prefix + formatCount(value, useComma) + suffix;
      }

      function animateCount(el) {
        var target = Number(el.getAttribute("data-count"));
        if (!target) return;

        var startTime = null;

        function step(timestamp) {
          if (!startTime) startTime = timestamp;
          var progress = Math.min((timestamp - startTime) / DURATION, 1);
          var eased = 1 - Math.pow(1 - progress, 3);
          var current = Math.round(target * eased);
          setCountValue(el, current);

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            setCountValue(el, target);
          }
        }

        requestAnimationFrame(step);
      }

      function startCounters(section) {
        var counters = section.querySelectorAll("[data-count]");
        counters.forEach(function (el) {
          if (el.dataset.counted === "true") return;
          el.dataset.counted = "true";
          animateCount(el);
        });
      }

      function revealSection(section) {
        section.classList.add("visible");
        startCounters(section);
      }

      var targets = document.querySelectorAll(".fade-in");
      var prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (targets.length === 0) return;

      if (prefersReducedMotion) {
        targets.forEach(function (el) {
          revealSection(el);
          el.querySelectorAll("[data-count]").forEach(function (counter) {
            setCountValue(counter, Number(counter.getAttribute("data-count")));
          });
        });
        return;
      }

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                revealSection(entry.target);
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.2 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          revealSection(el);
        });
      }
    })();
  </script>
</body>
</html>
