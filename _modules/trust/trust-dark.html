<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trust-dark</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --color-primary: #2abfb0;
      --color-white: #ffffff;
      --color-text: #1a1a2e;
      --color-bg-soft: #f4fdfb;
      --radius-btn: 6px;
      --radius-card: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--color-white);
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* TRUST */
    .trust-dark {
      background-color: #0d1b2a;
      padding: 100px 0;
    }

    .trust-dark__title {
      font-size: 40px;
      font-weight: 700;
      color: var(--color-white);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 60px;
    }

    .trust-dark__list {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .trust-dark__item {
      flex: 1;
      text-align: center;
      padding: 0 24px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    .trust-dark__item:first-child {
      border-left: none;
    }

    .trust-dark__label {
      font-size: 13px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .trust-dark__number {
      font-size: 56px;
      font-weight: 700;
      color: var(--color-white);
      line-height: 1.2;
    }

    .trust-dark__unit {
      color: var(--color-primary);
    }

    @media (max-width: 768px) {
      .trust-dark {
        padding: 60px 0;
      }

      .trust-dark__title {
        font-size: 26px;
        margin-bottom: 40px;
      }

      .trust-dark__list {
        flex-direction: column;
      }

      .trust-dark__item {
        border-left: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 24px 0;
      }

      .trust-dark__item:last-child {
        border-bottom: none;
      }

      .trust-dark__number {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>

  <!-- TRUST START -->
  <section class="trust-dark fade-in">
    <div class="wrap">
      <h2 class="trust-dark__title">숫자로 보는 신뢰,<br>우리의 성과를 확인하세요</h2>

      <ul class="trust-dark__list">
        <li class="trust-dark__item">
          <p class="trust-dark__label">누적 고객수</p>
          <p class="trust-dark__number">30,000<span class="trust-dark__unit">+</span></p>
        </li>
        <li class="trust-dark__item">
          <p class="trust-dark__label">누적 계약수</p>
          <p class="trust-dark__number">250<span class="trust-dark__unit">+</span></p>
        </li>
        <li class="trust-dark__item">
          <p class="trust-dark__label">운영 경력</p>
          <p class="trust-dark__number">13<span class="trust-dark__unit">년</span></p>
        </li>
      </ul>
    </div>
  </section>
  <!-- TRUST END -->

  <script>
    (function () {
      "use strict";

      var targets = document.querySelectorAll(".fade-in");

      if (targets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
