<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>service-story</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --story-color-bg: #fafafa;
      --story-color-text: #000000;
      --story-color-visual: #f3f3f9;
      --story-font-size-label: 20px;
      --story-font-size-title: 48px;
      --story-font-size-desc: 22px;
      --story-line-height-label: 1.58;
      --story-line-height-title: 1.4;
      --story-line-height-desc: 1.58;
      --story-gap-label-content: 16px;
      --story-gap-title-desc: 16px;
      --story-gap-row: 90px;
      --story-gap-content-visual: 126px;
      --story-content-width: 486px;
      --story-visual-width: 588px;
      --story-visual-height: 600px;
      --story-row-min-height: 600px;
      --story-radius-visual: 16px;
      --story-wrap-width: 1200px;
      --story-section-padding-top: 100px;
      --story-section-padding-bottom: 100px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "SUIT", sans-serif;
      line-height: 1.6;
      color: var(--story-color-text);
    }

    .wrap {
      max-width: var(--story-wrap-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* SERVICE STORY */
    .service-story {
      background-color: var(--story-color-bg);
      padding: var(--story-section-padding-top) 0 var(--story-section-padding-bottom);
    }

    .service-story > .wrap {
      padding-left: 0;
      padding-right: 0;
    }

    .service-story__list {
      display: flex;
      flex-direction: column;
      gap: var(--story-gap-row);
    }

    .service-story__row {
      display: flex;
      align-items: center;
      gap: var(--story-gap-content-visual);
      min-height: var(--story-row-min-height);
    }

    .service-story__content {
      flex: 0 0 var(--story-content-width);
      width: var(--story-content-width);
    }

    .service-story__label {
      font-size: var(--story-font-size-label);
      font-weight: 600;
      color: var(--story-color-text);
      line-height: var(--story-line-height-label);
      margin-bottom: var(--story-gap-label-content);
    }

    .service-story__body {
      display: flex;
      flex-direction: column;
      gap: var(--story-gap-title-desc);
    }

    .service-story__title {
      font-size: var(--story-font-size-title);
      font-weight: 700;
      color: var(--story-color-text);
      line-height: var(--story-line-height-title);
    }

    .service-story__desc {
      font-size: var(--story-font-size-desc);
      font-weight: 500;
      color: var(--story-color-text);
      line-height: var(--story-line-height-desc);
    }

    .service-story__visual {
      flex: 0 0 var(--story-visual-width);
      width: var(--story-visual-width);
      height: var(--story-visual-height);
      border-radius: var(--story-radius-visual);
      background-color: var(--story-color-visual);
      overflow: hidden;
    }

    .service-story__visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: var(--story-color-visual);
    }

    @media (max-width: 768px) {
      .service-story {
        padding: 60px 0;
      }

      .service-story > .wrap {
        padding-left: 20px;
        padding-right: 20px;
      }

      .service-story__list {
        gap: 60px;
      }

      .service-story__row {
        flex-direction: column;
        align-items: stretch;
        min-height: auto;
        gap: 32px;
      }

      .service-story__content {
        flex: none;
        width: 100%;
      }

      .service-story__title {
        font-size: 28px;
      }

      .service-story__desc {
        font-size: 16px;
      }

      .service-story__visual {
        flex: none;
        width: 100%;
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- SERVICE START -->
  <section class="service-story fade-in">
    <div class="wrap">
      <div class="service-story__list">
        <article class="service-story__row">
          <div class="service-story__content">
            <p class="service-story__label">Story 1</p>
            <div class="service-story__body">
              <h2 class="service-story__title">왜 다른 방식을 택했는가</h2>
              <p class="service-story__desc">기존의 범용적인 다이어트 가이드는 개인의 대사 환경을 무시한다. 우리는 고객의 관점에서 다시 시작하여 가장 과학적인 접근법을 제시합니다</p>
            </div>
          </div>
          <div class="service-story__visual" aria-hidden="true"></div>
        </article>

        <article class="service-story__row">
          <div class="service-story__visual" aria-hidden="true"></div>
          <div class="service-story__content">
            <p class="service-story__label">Story 2</p>
            <div class="service-story__body">
              <h2 class="service-story__title">기술이 지향하는 가치</h2>
              <p class="service-story__desc">복잡한 영양학 공부 대신, 앱이 제시하는 방향을 따르는 것만으로도 변화를 경험할 수 있도록 기술의 문턱을 낮추었습니다</p>
            </div>
          </div>
        </article>
      </div>
    </div>
  </section>
  <!-- SERVICE END -->

  <script>
    (function () {
      "use strict";

      var targets = document.querySelectorAll(".fade-in");

      if (targets.length === 0) return;

      if ("IntersectionObserver" in window) {
        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1 }
        );

        targets.forEach(function (el) {
          observer.observe(el);
        });
      } else {
        targets.forEach(function (el) {
          el.classList.add("visible");
        });
      }
    })();
  </script>
</body>
</html>
