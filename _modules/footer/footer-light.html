<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>footer-light</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --footer-bg: #fafafa;
      --footer-card: #f5f6f6;
      --footer-text: #000000;
      --footer-muted: rgba(0, 0, 0, 0.62);
      --footer-faint: rgba(0, 0, 0, 0.42);
      --footer-line: rgba(0, 0, 0, 0.12);
      --footer-logo: #e3e5eb;
      --footer-width: 1200px;
      --footer-space-top: 100px;
      --footer-space-bottom: 32px;
      --footer-gap-cols: 48px;
      --footer-radius: 16px;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    * { margin: 0; padding: 0; }

    body {
      font-family: "SUIT", sans-serif;
      color: var(--footer-text);
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: var(--footer-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-light {
      background: var(--footer-bg);
      border-top: 1px solid var(--footer-line);
    }

    .footer-light__top { padding: var(--footer-space-top) 0 48px; }

    .footer-light__grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr;
      gap: var(--footer-gap-cols);
    }

    .footer-light__brand {
      padding: 28px;
      border-radius: var(--footer-radius);
      background: var(--footer-card);
    }

    .footer-light__logo {
      width: 180px;
      height: 52px;
      border-radius: 8px;
      background: var(--footer-logo);
      margin-bottom: 18px;
    }

    .footer-light__intro {
      font-size: 16px;
      line-height: 1.58;
      color: var(--footer-muted);
      margin-bottom: 18px;
    }

    .footer-light__meta p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--footer-faint);
      margin-bottom: 4px;
    }

    .footer-light__title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    .footer-light__links a {
      display: block;
      font-size: 16px;
      line-height: 1.56;
      color: var(--footer-muted);
      margin-bottom: 10px;
    }

    .footer-light__divider { border-top: 1px solid var(--footer-line); }

    .footer-light__bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 0 var(--footer-space-bottom);
    }

    .footer-light__copy { font-size: 14px; color: var(--footer-faint); }
    .footer-light__legal { display: flex; gap: 18px; }
    .footer-light__legal a { font-size: 14px; color: var(--footer-muted); }

    @media (max-width: 768px) {
      .footer-light__top { padding: 60px 0 36px; }
      .footer-light__grid { grid-template-columns: 1fr; gap: 28px; }
      .footer-light__brand { padding: 20px; }
      .footer-light__bottom { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <!-- FOOTER START -->
  <footer class="footer-light">
    <div class="wrap">
      <div class="footer-light__top">
        <div class="footer-light__grid">
          <section class="footer-light__brand">
            <div class="footer-light__logo" aria-hidden="true"></div>
            <p class="footer-light__intro">데이터를 기반으로 건강한 습관을 설계하는 라이프스타일 파트너.</p>
            <div class="footer-light__meta">
              <p>상호명: OO 주식회사</p>
              <p>사업자등록번호: 000-00-00000</p>
              <p>서울특별시 OO구 OO로 000, OO빌딩 0층</p>
            </div>
          </section>

          <nav class="footer-light__links" aria-label="Service">
            <p class="footer-light__title">Service</p>
            <a href="#">서비스 소개</a>
            <a href="#">맞춤 프로그램</a>
            <a href="#">가격 안내</a>
            <a href="#">상담 신청</a>
          </nav>

          <nav class="footer-light__links" aria-label="Support">
            <p class="footer-light__title">Support</p>
            <a href="#">공지사항</a>
            <a href="#">자주 묻는 질문</a>
            <a href="#">고객센터</a>
            <a href="#">블로그</a>
          </nav>
        </div>
      </div>

      <div class="footer-light__divider"></div>

      <div class="footer-light__bottom">
        <p class="footer-light__copy">ⓒ 2026 OO 주식회사. All rights reserved.</p>
        <div class="footer-light__legal">
          <a href="#">이용약관</a>
          <a href="#">개인정보처리방침</a>
        </div>
      </div>
    </div>
  </footer>
  <!-- FOOTER END -->
</body>
</html>
