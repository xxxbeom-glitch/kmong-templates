<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>footer-minimal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root {
      --footer-bg: #000000;
      --footer-text: #ffffff;
      --footer-muted: rgba(255, 255, 255, 0.58);
      --footer-faint: rgba(255, 255, 255, 0.38);
      --footer-line: rgba(255, 255, 255, 0.12);
      --footer-logo: #e3e5eb;
      --footer-width: 1200px;
      --footer-space-y: 56px;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    * { margin: 0; padding: 0; }

    body {
      font-family: "SUIT", sans-serif;
      color: var(--footer-text);
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      max-width: var(--footer-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    .footer-minimal {
      background: var(--footer-bg);
      padding: var(--footer-space-y) 0;
    }

    .footer-minimal__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--footer-line);
    }

    .footer-minimal__logo {
      width: 160px;
      height: 44px;
      border-radius: 8px;
      background: var(--footer-logo);
      flex-shrink: 0;
    }

    .footer-minimal__info {
      font-size: 14px;
      line-height: 1.7;
      color: var(--footer-muted);
      text-align: right;
    }

    .footer-minimal__bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-top: 20px;
    }

    .footer-minimal__copy { font-size: 13px; color: var(--footer-faint); }
    .footer-minimal__legal { display: flex; gap: 16px; }
    .footer-minimal__legal a { font-size: 13px; color: var(--footer-muted); }

    @media (max-width: 768px) {
      .footer-minimal { padding: 42px 0; }
      .footer-minimal__top,
      .footer-minimal__bottom { flex-direction: column; align-items: flex-start; }
      .footer-minimal__info { text-align: left; }
    }
  </style>
</head>
<body>
  <!-- FOOTER START -->
  <footer class="footer-minimal">
    <div class="wrap">
      <div class="footer-minimal__top">
        <div class="footer-minimal__logo" aria-hidden="true"></div>
        <p class="footer-minimal__info">서울특별시 OO구 OO로 000, OO빌딩 0층 · 000-0000-0000 · info@example.com</p>
      </div>

      <div class="footer-minimal__bottom">
        <p class="footer-minimal__copy">ⓒ 2026 OO 주식회사. All rights reserved.</p>
        <div class="footer-minimal__legal">
          <a href="#">이용약관</a>
          <a href="#">개인정보처리방침</a>
        </div>
      </div>
    </div>
  </footer>
  <!-- FOOTER END -->
</body>
</html>
